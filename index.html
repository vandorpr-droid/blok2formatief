<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fight for your right – Level Up</title><style>:root{font-family:system-ui,Arial;background:#f7f7ff;color:#202343}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:28px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.08;margin:24px 0 12px}h2{font-size:1.65rem}p{line-height:1.6;color:#505575}.tag{color:#111827;background:#facc15;padding:8px 13px;border-radius:100px;font-weight:800}.card{background:#ffffff;border:1px solid #e5e4f4;border-radius:18px;padding:24px;margin:18px 0}.muted{color:#656a86}button{cursor:pointer;border:0;background:#ffce56;color:#292342;border-radius:11px;padding:13px 18px;font-weight:800;font-size:1rem}button.secondary{background:#eeeaff;color:#34315d}button:disabled{opacity:.5;cursor:not-allowed}.answers{display:grid;gap:10px}.answers button{text-align:left;background:#eeeaff;color:#34315d;border:2px solid transparent}.answers button.selected{border-color:#facc15;background:#e2d7ff}.progress{height:9px;background:#e7e5fa;border-radius:10px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#facc15;transition:width .2s}.pill{display:inline-block;background:#e7e5fa;padding:7px 12px;border-radius:20px;margin:4px;font-size:.9rem}textarea,input{width:100%;background:#ffffff;color:#202343;border:1px solid #b8b5d7;border-radius:10px;padding:12px;font:inherit}textarea{min-height:135px;resize:vertical}label{display:block;margin:16px 0 8px;font-weight:700}.feedback{background:#e9fbf1;border-left:4px solid #20b981;padding:14px;border-radius:8px;margin-top:12px}.feedback.needs{background:#fff0d9;border-left-color:#ed8b22;color:#743c0a}.goal.needs{background:#fff3e3;border:2px solid #ed9b3b}.goal.needs button{background:#f59e42;color:#43220a}.mission-card{background:#e8dcff;border:2px solid #8b5cf6}.mission-card h2{background:#6d28d9;color:white;padding:15px;border-radius:12px}.practice-review{background:#f1f7ff;border-left:5px solid #527bd3;padding:17px;border-radius:12px;margin-top:18px}.exit-ready{background:#e4faec;border:2px solid #22a66d;padding:12px;border-radius:12px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.goal{background:#ffffff;border:1px solid #e0dcf5;border-radius:14px;padding:17px}.goal button{margin-top:12px}.small{font-size:.87rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}body{background:radial-gradient(circle at 95% 0%,#ffe7f0 0,transparent 36%),radial-gradient(circle at 5% 15%,#e3e5ff 0,transparent 34%),#f7f7ff}header strong{font-size:1.05rem;letter-spacing:.04em}h1{color:#26204b}h2{color:#332b65}.card{box-shadow:0 8px 28px rgba(64,47,116,.07)}button{transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-2px);box-shadow:0 4px 12px #bcb2e2}.tag{background:#d9f8e9;color:#165c47}.route-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}.route-step{background:white;border:1px solid #e5def6;border-radius:18px;padding:17px 12px;box-shadow:0 6px 18px #a8a1cc1c}.route-step .emoji{font-size:2rem}.route-step strong{display:block;margin:8px 0;color:#31255e}.route-step small{display:block;color:#66627f}.route-step .minutes{display:inline-block;margin-top:10px;background:#efe9ff;border-radius:20px;padding:5px 9px;color:#5b3bb6;font-weight:800}.hero{padding:22px 0}.hero h1{margin-bottom:8px}.hero p{max-width:700px}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.status{border-radius:14px;background:#f6f4ff;padding:14px;border:1px solid #e7e1f7}.status.done{background:#e6fbef;border-color:#a6e8c4}.status.needs{background:#fff3e5;border-color:#f5d6a3}.status b{display:block;margin-bottom:6px}.status small{color:#625c77}.timer-box{background:linear-gradient(110deg,#e9e2ff,#dff7ff);border:1px solid #bdb2ed;border-radius:18px;padding:18px 22px;margin:15px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.timer-box strong{font-size:2rem;color:#4a328e;font-variant-numeric:tabular-nums}.timer-box.warning{background:#fff0d7;border-color:#eab96a}.timer-box.finished{background:#ffe1e4;border-color:#e88b99}.timer-box span{max-width:340px;color:#624f76}.lead{font-size:1.13rem}.banner{background:#fff2ca;padding:15px 18px;border-radius:14px;color:#59420c;margin-top:16px}@media(max-width:760px){.route-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.route-step:last-child{grid-column:span 2}.timer-box{display:block}.timer-box strong{display:block}}@media print{body{background:white;color:black}button,header,.progress{display:none!important}.card{border:1px solid #999;background:white}p,.muted{color:#333}}</style></head><body><main><header><strong>✊ FIGHT FOR YOUR RIGHT</strong><span class="tag" id="phase">START</span></header><div class="progress"><div id="bar" style="width:0%"></div></div><div id="app"></div></main><script>
const goals=[
{title:'Normen, waarden en samenleving',desc:'Ik reflecteer op verantwoordelijkheid voor welzijn en gebruik verzorgingsstaat en participatiesamenleving.',q:'Een gemeente stopt met een deel van de professionele ondersteuning voor ouderen. Buurtbewoners worden gevraagd hulp te organiseren. Welke analyse is het meest overtuigend?',opts:['De gemeente draagt de verantwoordelijkheid volledig over; hulp aan ouderen is voortaan uitsluitend een privézaak.','De maatregel past bij de participatiesamenleving, maar roept de vraag op welke ondersteuning de verzorgingsstaat moet blijven bieden.','De maatregel past uitsluitend bij de verzorgingsstaat, omdat de gemeente bepaalt wie hulp moet verlenen.'],correct:1,why:'Voor gewenst niveau: leg normen, waarden, verzorgingsstaat én participatiesamenleving uit en verbind elk begrip aan de casus. Voor uitdaging: bespreek wie volgens jou verantwoordelijk is voor welzijn, met argumenten.',task:'Een gemeente vermindert professionele buurthulp en vraagt buurtbewoners bij te springen.',prompts:['Leg de begrippen verzorgingsstaat en participatiesamenleving uit in je eigen woorden.','Welke normen en waarden spelen in deze casus? Leg beide begrippen aan de hand van de casus uit.','Wie moet volgens jou verantwoordelijk zijn voor het welzijn van ouderen? Geef twee argumenten en erken een ander perspectief.']},
{title:'Boosheid en perspectieven',desc:'Ik onderzoek hoe boosheid wordt geuit en hoe groepen verschillend naar een situatie kijken.',q:'Een gemeente sluit een skatepark na klachten van omwonenden. Skaters protesteren; bewoners sturen een brief. Welke conclusie toont inzicht in perspectieven?',opts:['Skaters willen ruimte om elkaar te ontmoeten, bewoners willen rust. Vergelijk hun belangen én hoe beide groepen hun onvrede uiten.','De demonstratie bewijst dat de skaters meer last hebben van het besluit dan de omwonenden.','De bewoners gebruiken een officiële brief en hebben daarom een beter onderbouwd standpunt dan de skaters.'],correct:0,why:'Voor gewenst niveau: beschrijf verschillende uitingsvormen van boosheid en benoem meerdere perspectieven in een actuele casus. Voor uitdaging: vergelijk de perspectieven kritisch en bespreek oorzaken of gevolgen.',task:'Een gemeente sluit een skateplek vanwege geluidsoverlast. Skaters organiseren een demonstratie; omwonenden schrijven een petitie.',prompts:['Beschrijf twee uitingsvormen van boosheid in deze casus.','Beschrijf het perspectief van skaters en omwonenden. Wat vinden ze belangrijk?','Vergelijk de perspectieven kritisch. Welke maatschappelijke oorzaken en gevolgen zie je?']},
{title:'Artikel 7 en dilemma’s',desc:'Ik begrijp vrijheid van meningsuiting en onderzoek dilemma’s die daarbij kunnen ontstaan.',q:'Een theatergroep bekritiseert een religieuze traditie. Bezoekers eisen dat de voorstelling niet doorgaat. Wat is hier het relevante dilemma?',opts:['Een voorstelling is alleen beschermd als de boodschap feitelijk juist en voor iedereen aanvaardbaar is.','De vrijheid van meningsuiting betekent dat iedere voorstelling altijd zonder gevolgen moet kunnen plaatsvinden.','Artikel 7 beschermt het uiten van opvattingen; tegelijk kunnen andere belangen en wettelijke grenzen aanleiding geven tot discussie.'],correct:2,why:'Voor gewenst niveau: leg artikel 7 uit en beschrijf een passend dilemma. Voor uitdaging: onderzoek botsende belangen of grondrechten en onderbouw jouw standpunt met argumenten en voorbeelden.',task:'Een theatergroep wil een scherpe voorstelling opvoeren over een religieuze traditie. Een aantal bezoekers voelt zich gekwetst door de voorstelling en eist dat deze wordt geannuleerd.',prompts:['Wat beschermt artikel 7 van de Grondwet? Noem een dilemma.','Leg uit waarom hier een dilemma ontstaat. Beschrijf twee verschillende standpunten.','Formuleer je eigen standpunt met twee argumenten en een concreet voorbeeld.']},
{title:'Invloed buiten de politiek',desc:'Ik ontdek hoe media, protest, kunst en sociale acties maatschappelijke kwesties kunnen beïnvloeden.',q:'Leerlingen ervaren discriminatie bij het uitgaan. Zij willen dat meer mensen hierover nadenken. Welke aanpak beïnvloedt het debat zonder rechtstreeks via politieke besluitvorming te werken?',opts:['De leerlingen vragen uitsluitend aan een raadslid om het probleem in de gemeenteraad te bespreken.','De leerlingen maken met ervaringsverhalen een korte theatervoorstelling en organiseren een nagesprek met bezoekers.','De leerlingen wachten op een wetsvoorstel voordat ze hun ervaringen met anderen delen.'],correct:1,why:'Voor gewenst niveau: leg uit hoe kunst, media, protest of sociale acties een vraagstuk buiten de politiek agenderen. Voor uitdaging: vergelijk twee manieren en beargumenteer welke bij deze situatie het meest effectief is.',task:'Jongeren willen dat de gemeente een veilige ontmoetingsplek creëert.',prompts:['Noem één manier om dit buiten de politiek onder de aandacht te brengen.','Werk twee manieren uit, bijvoorbeeld theater en een sociale-mediacampagne.','Vergelijk twee aanpakken en beargumenteer welke in deze situatie het effectiefst is.']},
{title:'Een onderbouwd theaterstandpunt',desc:'Ik laat in verhaallijn en poster mijn standpunt en verschillende perspectieven zien.',q:'Een toneelstuk gaat over armoede. Welke keuze laat een onderbouwd standpunt én verschillende perspectieven het beste zien?',opts:['Een scène waarin een ouder en een beleidsmaker botsen over hulp, terwijl hun belangen en de boodschap van de maker zichtbaar worden.','Een monoloog waarin de hoofdpersoon vertelt dat armoede vervelend is en het publiek vraagt te applaudisseren.','Een poster met de titel Armoede en een verhaallijn waarin de hoofdpersonen vooral hun dagelijkse routine laten zien.'],correct:0,why:'Voor gewenst niveau: toon een duidelijk standpunt in verhaallijn én poster en laat verschillende perspectieven zien. Voor uitdaging: maak ook duidelijk welke belangen met elkaar botsen.',task:'Gebruik jouw eigen maatschappelijke thema en theatervoorstelling.',prompts:['Noteer jouw thema, standpunt en twee betrokken groepen.','Schrijf een korte scène waarin twee perspectieven zichtbaar worden.','Maak duidelijk welke belangen botsen en hoe je dit zichtbaar maakt in je verhaallijn én poster.']},
{title:'Geëngageerde kunst',desc:'Ik analyseer hoe kunstenaars maatschappelijke en politieke boodschappen zichtbaar maken.',q:'Een kunstenaar maakt een installatie met lege schooltassen om aandacht te vragen voor kinderen die niet naar school kunnen. Wat maakt de analyse van dit werk sterk?',opts:['Het werk is geëngageerd omdat het publiek emotioneel kan reageren, ongeacht het onderwerp.','Het werk is geëngageerd omdat iedere installatie met herkenbare voorwerpen een politieke boodschap heeft.','Het werk verbeeldt een maatschappelijk probleem; de vorm kan bezoekers aanzetten om na te denken over onderwijsongelijkheid.'],correct:2,why:'Voor gewenst niveau: leg uit wat geëngageerde kunst is én analyseer hoe de maker de boodschap zichtbaar maakt. Voor uitdaging: vergelijk kunstvoorbeelden en beoordeel hun mogelijke effect.',task:'Denk aan jouw eigen voorstelling en aan een voorbeeld van geëngageerde kunst uit de les.',prompts:['Leg in eigen woorden uit wat geëngageerde kunst is.','Beschrijf hoe jouw voorstelling een maatschappelijke boodschap zichtbaar maakt.','Vergelijk jouw voorstelling met een ander kunstvoorbeeld: welke aanpak kan meer bewustwording oproepen en waarom?']},
{title:'Kan kunst iets veranderen?',desc:'Ik reflecteer op de maatschappelijke rol van kunstenaars en de invloed van kunst.',q:'Een voorstelling over online haat leidt tot gesprekken op school, maar er verandert nog geen schoolregel. Welke conclusie is het best te verdedigen?',opts:['De voorstelling heeft gefaald, want alleen een concrete beleidswijziging telt als maatschappelijke invloed.','De voorstelling kan bewustwording vergroten; of dat tot verandering leidt, hangt af van wat mensen daarna doen.','De voorstelling heeft de samenleving veranderd, want een gesprek betekent automatisch dat gedrag blijvend verandert.'],correct:1,why:'Voor gewenst niveau: leg met een concreet voorbeeld uit hoe kunst bewustwording of verandering kan stimuleren. Voor uitdaging: weeg de invloed kritisch af met meerdere voorbeelden.',task:'Jouw voorstelling maakt een maatschappelijk probleem zichtbaar.',prompts:['Noem één manier waarop kunst invloed kan hebben.','Leg met een concreet voorbeeld uit hoe theater bewustwording of verandering kan stimuleren.','Beredeneer met twee voorbeelden wanneer kunst wel of niet tot maatschappelijke verandering leidt.']}
];
let reviewVisible=false,exitNoticeShown=false;let stage='start',idx=0,answers=[],chosen=null,selectedGoal=0,level=1,work='',name='',theme='',saved={},showQuizFeedback=false,exitText='',practiceStarted=null,practiceDone=false;const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setPhase(t,n){document.getElementById('phase').textContent=t;document.getElementById('bar').style.width=n+'%'}function practiceTimeFinished(){return practiceStarted!==null && Date.now()-practiceStarted>=900000}function canExit(){return hasCompletedPractice() && practiceTimeFinished()}function remainingPractice(){return practiceStarted===null?900:Math.max(0,900-Math.floor((Date.now()-practiceStarted)/1000))}function fmtTime(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}function hasCompletedPractice(){return Object.values(saved).some(v=>typeof v==='string' && v.trim().length>=20)}function render(){if(stage==='start'){setPhase('START',0);app.innerHTML=`<div class="hero"><span class="tag">🎭 JOUW PERSOONLIJKE LEERAVONTUUR</span><h1>Hoe sterk is jouw stem? ✊</h1><p class="lead">Ontdek waar je goed in bent, versterk je argumenten en bereid je voor op jouw eigen geëngageerde theatervoorstelling.</p></div><h2>🗺️ Dit is jouw leerroute</h2><div class="route-grid"><div class="route-step"><div class="emoji">🧠</div><strong>1. Ontdek</strong><small>7 verdiepende vragen met feedback</small><span class="minutes">12 min</span></div><div class="route-step"><div class="emoji">🎯</div><strong>2. Kies</strong><small>Bekijk je voortgang en kies je doelen</small><span class="minutes">3 min</span></div><div class="route-step"><div class="emoji">⚡</div><strong>3. Oefen</strong><small>Werk aan zoveel doelen als je wilt, minimaal één</small><span class="minutes">15 min</span></div><div class="route-step"><div class="emoji">📝</div><strong>4. Reflecteer</strong><small>Bekijk de missie en schrijf je eigen exit-ticket</small><span class="minutes">10 min</span></div><div class="route-step"><div class="emoji">💬</div><strong>5. Bespreek</strong><small>Sluit klassikaal af met je docent</small><span class="minutes">10 min</span></div></div><div class="banner">⏱️ Tijdens het oefenen loopt een timer van 15 minuten. Je krijgt een seintje bij 3 minuten resterend. Pas na 15 minuten én minimaal één bewaarde oefening kun je door naar het exit-ticket. Je mag je huidige opdracht rustig afronden.</div><div class="card"><h2>🚀 Klaar om te beginnen?</h2><label for="nm">Voornaam (optioneel)</label><input id="nm" placeholder="Jouw voornaam" value="${esc(name)}"><label for="th">Wat is het thema van jouw eigen voorstelling? (optioneel)</label><input id="th" placeholder="Bijvoorbeeld: discriminatie, klimaat, sociale media" value="${esc(theme)}"><div class="actions"><button id="start">Start mijn leerroute →</button></div></div><p class="small muted">De quiz geeft een eerste indicatie. Je docent beoordeelt je werk aan de hand van de rubric. Je hoeft niets te printen of te downloaden.</p>`;document.getElementById('start').onclick=()=>{name=document.getElementById('nm').value;theme=document.getElementById('th').value;stage='quiz';render()};return}
if(stage==='quiz'){setPhase('DE CHECK',Math.round(idx/7*30));let g=goals[idx];app.innerHTML=`<p class="muted">Vraag ${idx+1} van 7 · Leerdoel ${idx+1}</p><h1>${esc(g.title)}</h1><div class="card"><h2>${esc(g.q)}</h2><div class="answers">${g.opts.map((o,i)=>`<button data-choice="${i}" class="${chosen===i?'selected':''}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${showQuizFeedback?`<div class="feedback ${chosen===g.correct?'':'needs'}"><strong>${chosen===g.correct?'Goed beredeneerd':'Hier kun je groeien'}</strong><p>${esc(g.why)}</p><p><strong>Wat vraagt de rubric?</strong> Gebruik deze aanwijzing straks bij jouw leerdoel.</p></div>`:''}<div class="actions"><button id="next" ${chosen===null?'disabled':''}>${showQuizFeedback?(idx===6?'Bekijk mijn leerroute →':'Volgende vraag →'):'Controleer mijn antwoord →'}</button></div></div>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(!showQuizFeedback){chosen=+b.dataset.choice;render()}});document.getElementById('next').onclick=()=>{if(!showQuizFeedback){showQuizFeedback=true;render();return}answers.push(chosen);chosen=null;showQuizFeedback=false;idx++;if(idx===7)stage='choose';render()};return}
if(stage==='reflect' && !canExit()){stage='choose'}if(stage==='choose'){setPhase('KIES JE DOEL',35);let wrong=goals.map((g,i)=>i).filter(i=>answers[i]!==goals[i].correct);app.innerHTML=`<h1>Jouw persoonlijke leerroute</h1><div class='card'><h2>📊 Jouw voortgangsoverzicht</h2><p><strong>${Object.keys(saved).length} van 7 leerdoelen geoefend</strong> · ${7-wrong.length} van 7 oriëntatievragen goed</p><div class='dashboard'>${goals.map((x,i)=>`<div class='status ${saved[i]?'done':answers[i]===x.correct?'':'needs'}'><b>${saved[i]?'✅':answers[i]===x.correct?'🔵':'🟠'} Leerdoel ${i+1}</b><small>${esc(x.title)}</small><br><small>${saved[i]?'Geoefend':answers[i]===x.correct?'Basisinzicht getoond':'Extra aandacht aanbevolen'}</small></div>`).join('')}</div><p class='small muted'><strong>Verplicht:</strong> oefen minimaal 15 minuten én bewaar minimaal één inhoudelijk uitgewerkte oefening. Pas daarna kun je naar het exit-ticket. Je mag zoveel extra leerdoelen oefenen als je wilt. Een quizantwoord is geen definitieve rubricbeoordeling.</p></div><p>Je hebt ${7-wrong.length} van de 7 oriëntatievragen goed. Dat is een eerste aanwijzing, geen beoordeling van jouw niveau. Kies een leerdoel om vandaag sterker in te worden.</p><div class="grid">${goals.map((g,i)=>`<div class="goal ${answers[i]===g.correct?'':'needs'}"><strong>Leerdoel ${i+1}</strong><p><b>${esc(g.title)}</b></p><p class="small">${answers[i]===g.correct?'✓ Basisinzicht getoond; laat je niveau zien in de uitwerking':'↗ Oefen dit criterium verder'}</p><p class="small">${esc(g.why)}</p><button data-goal="${i}">Kies dit doel →</button></div>`).join('')}<div class='actions'><button id='finishPractice' ${canExit()?'':'disabled'}>${canExit()?'Ga naar exit-ticket →':!hasCompletedPractice()?'🔒 Bewaar eerst een oefening': '🔒 Nog '+fmtTime(remainingPractice())+' oefenen'}</button><p id='exitLockHint' class='small muted'>${canExit()?'Je hebt minstens 15 minuten geoefend en een oefening bewaard.': 'Het exit-ticket wordt pas beschikbaar na 15 minuten oefentijd én een bewaarde oefening.'}</p></div></div>`;document.getElementById('finishPractice').onclick=()=>{if(!canExit())return;stage='reflect';render();window.scrollTo(0,0)};app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{selectedGoal=+b.dataset.goal;stage='learn';if(practiceStarted===null)practiceStarted=Date.now();level=1;work=saved[selectedGoal]||'';reviewVisible=false;render()});return}
let g=goals[selectedGoal];if(stage==='learn'){setPhase('JOUW UITDAGING',55);app.innerHTML=`<div id='practiceTimer' class='timer-box'><div>⏱️ <b>Jouw oefentijd</b><strong id='timeleft'>15:00</strong></div><span id='timehint'>Je kiest zelf hoeveel leerdoelen je oefent.</span></div><p class="muted">Leerdoel ${selectedGoal+1} van 7</p><h1>${esc(g.title)}</h1><p>${esc(g.desc)}</p><div class="card"><h2>Dit vraagt de rubric van jou</h2><p>${esc(g.why)}</p><h2>Kies jouw niveau</h2><div class="answers">${['Instapniveau – ik bouw de basis op','Gewenst niveau – ik laat zien dat ik het begrijp','Uitdaging – ik analyseer en onderbouw'].map((s,i)=>`<button data-level="${i}" class="${level===i?'selected':''}">${s}</button>`).join('')}</div><div class="actions"><button id="go">Aan de slag →</button><button class="secondary" id="back">Ander doel kiezen</button></div></div>`;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;render()});document.getElementById('go').onclick=()=>{stage='work';render()};document.getElementById('back').onclick=()=>{stage='choose';render()};return}
if(stage==='work'){setPhase('MAAK JE BEWIJS',75);app.innerHTML=`<div id='practiceTimer' class='timer-box'><div>⏱️ <b>Jouw oefentijd</b><strong id='timeleft'>15:00</strong></div><span id='timehint'>Je kiest zelf hoeveel leerdoelen je oefent.</span></div><p class="muted">Leerdoel ${selectedGoal+1} · ${['Instapniveau','Gewenst niveau','Uitdaging'][level]}</p><h1>Maak jouw bewijs</h1><div class="card"><p class="pill">Casus / uitgangspunt</p><h2>${esc(g.task)}</h2><p><b>Jouw opdracht:</b> ${esc(g.prompts[level])}</p>${selectedGoal>=4?'<p class="muted small">Tip: gebruik je eigen verhaallijn en poster. De volledige missie lever je later in via SomToday.</p>':''}<label for="work">Schrijf jouw antwoord of ontwerp hier je scène</label><textarea id="work" placeholder="Mijn uitwerking...">${esc(work)}</textarea>${reviewVisible?`<div class="practice-review" role="status"><h2>🎯 Feedback vanuit de rubric</h2><p><strong>Je oefent op ${['instapniveau','gewenst niveau','uitdaging'][level]}.</strong> Controleer of je antwoord het volgende laat zien:</p><p>${esc(g.prompts[level])}</p><p><strong>Om verder te groeien:</strong> ${esc(g.why)}</p><p><strong>Let op:</strong> dit zijn rubricgerichte controlepunten, geen automatische inhoudelijke beoordeling van jouw tekst. Kijk zelf kritisch of je alles hebt onderbouwd.</p><button id="nextGoal">✓ Ik heb de feedback bekeken – kies een nieuw leerdoel →</button></div>`:''}<div class="actions">${reviewVisible?'':`<button id="check">Controleer en ontvang feedback →</button><button class="secondary" id="lvl">Pas niveau aan</button>`}</div></div>`;if(!reviewVisible){document.getElementById('check').onclick=()=>{work=document.getElementById('work').value;if(work.trim().length<20){alert('Werk je antwoord eerst verder uit (minimaal 20 tekens), zodat je echt met dit leerdoel hebt geoefend.');return}saved[selectedGoal]=work;reviewVisible=true;render()};document.getElementById('lvl').onclick=()=>{work=document.getElementById('work').value;stage='learn';render()}}else{document.getElementById('work').readOnly=true;document.getElementById('nextGoal').onclick=()=>{stage='choose';reviewVisible=false;render();window.scrollTo(0,0)}};document.getElementById('lvl').onclick=()=>{work=document.getElementById('work').value;stage='learn';render()};return}
if(stage==='reflect'){window.scrollTo(0,0);setPhase('EXIT-TICKET',95);app.innerHTML=`<h1>Jouw voorbereiding op de eindopdracht</h1><p>De website geeft je een aanwijzing over je niveau. Je docent beoordeelt jouw werk met de rubric; de quiz alleen is daarvoor niet voldoende.</p><div class="card"><h2>📊 Jouw voortgang: ${Object.keys(saved).length} van 7 leerdoelen geoefend</h2><p>${goals.map((x,i)=>saved[i]?`✓ Leerdoel ${i+1}: ${esc(x.title)}`:'').filter(Boolean).join('<br>')||'Je hebt nog geen oefening bewaard.'}</p><h2>Terugblik op leerdoel ${selectedGoal+1}</h2><p><strong>Wat je moest laten zien:</strong> ${esc(g.prompts[level])}</p><p><strong>Rubricgericht verbeteradvies:</strong> ${esc(g.why)}</p><p><strong>Jouw oefenantwoord:</strong></p><p style="white-space:pre-wrap">${esc(work)||'Je hebt nog geen oefenantwoord ingevuld.'}</p></div><div class="card mission-card"><h2>🎭 Dit is de eindopdracht in de les</h2><p>Je belicht jouw eigen geëngageerde theatervoorstelling vanuit verschillende perspectieven:</p><ol><li>Leg uit waarom jouw voorstelling geëngageerd theater is en bewijs dat met een voorbeeld uit je verhaallijn.</li><li>Schrijf een beargumenteerde reactie van een boze bezoeker.</li><li>Schrijf een beargumenteerde reactie van een <strong>werkelijk bestaande belangenpartij</strong> en noem deze bij naam.</li><li>Schrijf een onderbouwd deel van een subsidieaanvraag: waarom verdient jouw voorstelling overheidssubsidie en wat is de maatschappelijke betekenis?</li><li>Leg met een concreet voorbeeld uit in hoeverre kunst maatschappelijke verandering kan stimuleren.</li><li>Leg uit hoe een mening uiten via kunst verschilt van invloed uitoefenen via de politiek.</li></ol><p class="small muted">De eindopdracht maak je klassikaal in de les. Je mag je verhaallijn en poster meenemen.</p></div><div class="card"><h2>Drie tips voordat je de eindopdracht maakt</h2><ul><li><strong>Lees de rubric en de volledige eindopdracht opnieuw.</strong> Controleer wat je moet aantonen om het gewenste niveau te halen.</li><li><strong>Zoek vooraf een werkelijk bestaande belangenpartij bij jouw thema.</strong> Noteer de naam en onderzoek haar standpunten. Dit kun je niet tijdens de eindopdracht opzoeken.</li><li><strong>Neem je verhaallijn én poster mee</strong> naar de les waarin je de eindopdracht maakt.</li></ul></div><div class="card"><h2>Jouw exit-ticket</h2><p>Welke concrete tips geef jij jezelf voor de eindopdracht? Kijk terug naar jouw quiz, rubriccriteria en oefening. Formuleer zelf wat jij nog moet doen.</p><label for="exit">Mijn persoonlijke tips en aandachtspunten</label><textarea id="exit" placeholder="Bijvoorbeeld: Ik moet in mijn reactie van de boze bezoeker niet alleen boosheid noemen, maar ook twee argumenten geven...">${esc(exitText)}</textarea><div class="actions"><button id="edit">Bekijk mijn leerdoelen</button><button class="secondary" id="another">Oefen nog een leerdoel</button></div><p class="small muted">Je hoeft niets te downloaden of uit te printen. Bespreek je exit-ticket eventueel met je docent of maak er zelf een aantekening van.</p></div>`;document.getElementById('exit').oninput=e=>{exitText=e.target.value};document.getElementById('edit').onclick=()=>{exitText=document.getElementById('exit').value;stage='choose';render()};document.getElementById('another').onclick=()=>{exitText=document.getElementById('exit').value;stage='choose';render()};return}}render();setInterval(()=>{if(practiceStarted===null)return;const remaining=Math.max(0,900-Math.floor((Date.now()-practiceStarted)/1000));const el=document.getElementById('timeleft');if(el){el.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');const hint=document.getElementById('timehint');const timerBox=document.getElementById('practiceTimer');if(timerBox)timerBox.className='timer-box '+(remaining===0?'finished':remaining<=180?'warning':'');if(hint)hint.textContent=remaining===0?'15 minuten voorbij! Controleer je antwoord, kies daarna een nieuw leerdoel of ga via het overzicht naar je exit-ticket.':remaining<=180?'Nog drie minuten of minder: werk rustig verder.':'';}if(stage==='choose'){const btn=document.getElementById('finishPractice');if(btn){btn.disabled=!canExit();btn.textContent=canExit()?'Ga naar exit-ticket →':!hasCompletedPractice()?'🔒 Bewaar eerst een oefening':'🔒 Nog '+fmtTime(remaining)+' oefenen';const h=document.getElementById('exitLockHint');if(h&&canExit())h.innerHTML='<div class="exit-ready">🎉 Je 15 minuten zijn voorbij! Klik op de knop <strong>Ga naar exit-ticket →</strong> hierboven.</div>';if(canExit()&&!exitNoticeShown){exitNoticeShown=true;btn.scrollIntoView({behavior:'smooth',block:'center'});btn.focus({preventScroll:true})}}}} ,1000);
</script></body></html>
